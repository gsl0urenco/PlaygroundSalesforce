# Nome do Workflow
name: DevOps

# Evento que dispara a pipeline
on:
  push:
    branches:
      - master

jobs:
  # CI: Responsável por rodar o deploy na Org e executar testes unitários
  CI:
    runs-on: ubuntu-latest

    steps:  
      # 1. Checkout do código fonte
      - uses: actions/checkout@v4

      # 2. Configura o ambiente Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      # 3. Instala a CLI atualizada da Salesforce
      - name: Install Salesforce CLI
        run: |
          npm install -g @salesforce/cli

      # 4. Autenticação, Deploy e Execução de Testes Apex
      - name: Validate Package Salesforce
        run: |
          mkdir -p config
          echo "force://${{ secrets.CLI_APP }}::${{ secrets.USER_TOKEN }}@${{ secrets.SF_URL }}" > config/auth.txt
          
          # Autentica a Org Principal
          sf org login sfdx-url -f config/auth.txt -a MyOrg --set-default
          
          # Realiza o deploy dos fontes da pasta force-app na Org autenticada
          sf project deploy start -d force-app -o MyOrg
          
          # Executa os testes Apex locais na Org (sem a flag --verbose)
          sf apex run test -l RunLocalTests -o MyOrg -c -r human -w 2
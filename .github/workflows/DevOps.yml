# Nome do Workflow
name: DevOps

# Evento que dispara a pipeline
on:
  push:
    branches:
      - master

jobs:
  # CI: Responsável por rodar o deploy na Scratch Org e executar testes unitários
  CI:
    runs-on: ubuntu-latest

    steps:  
      # 1. Checkout do código fonte
      - uses: actions/checkout@v4

      # 2. Configura o ambiente Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      # 3. Instala a CLI atualizada da Salesforce
      - name: Install Salesforce CLI
        run: |
          npm install -g @salesforce/cli

      # 4. Autenticação, criação da Scratch Org, Deploy e Testes Apex
      - name: Validate Package Salesforce
        run: |
          mkdir -p config
          echo "force://${{ secrets.CLI_APP }}::${{ secrets.USER_TOKEN }}@${{ secrets.SF_URL }}" > config/auth.txt
          
          # Autentica a Dev Hub / Org Principal
          sf org login sfdx-url -f config/auth.txt --set-default-dev-hub -a MyOrg
          
          # Cria a Scratch Org vinculada à MyOrg (-d 1 define a duração para 1 dia)
          sf org create scratch -f config/project-scratch-def.json -a CIOrg -v MyOrg -d 1
          
          # Envia as fontes e executa os testes Apex
          sf project deploy start -o CIOrg
          sf apex run test -l RunLocalTests -o CIOrg -c -r human -w 2 --verbose
          
          # Remove a Scratch Org ao final da execução
          sf org delete scratch -o CIOrg --no-prompt